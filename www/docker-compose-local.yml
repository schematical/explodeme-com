version: '3.8'
services:
  web:
    build: ..
    ports:
      - "3000:3000"
    environment:
      PUBLIC_ASSET_URL: "http://localhost:3000"
    develop:
      watch:
        - action: sync
          path: .next
          target: /app/.next
  cache:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning # --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - cache:/data
volumes:
  cache:
    driver: local